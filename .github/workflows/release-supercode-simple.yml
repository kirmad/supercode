name: Release Supercode (Simple)
run-name: "${{ format('Supercode Simple Release v{0}', inputs.version || github.ref_name) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.0"

      - name: Install dependencies
        run: bun install

      - name: Set version
        run: |
          VERSION="${{ inputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Releasing version: $VERSION"

      - name: Update version in package.json files
        run: |
          # Update all package.json files
          find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/dist/*" | while read file; do
            if grep -q '"version":' "$file"; then
              sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$file"
              echo "Updated version in: $file"
            fi
          done
          
          # Update lock file
          bun install

      - name: Build releases for all platforms
        run: |
          cd packages/opencode
          mkdir -p dist
          
          # Build TUI binaries for each platform
          echo "Building TUI binaries..."
          cd ../tui
          
          # Linux AMD64
          echo "Building Linux AMD64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o ../opencode/dist/tui-linux-amd64 \
            ./cmd/opencode/main.go
          
          # Linux ARM64
          echo "Building Linux ARM64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o ../opencode/dist/tui-linux-arm64 \
            ./cmd/opencode/main.go
          
          # Darwin AMD64
          echo "Building Darwin AMD64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o ../opencode/dist/tui-darwin-amd64 \
            ./cmd/opencode/main.go
          
          # Darwin ARM64
          echo "Building Darwin ARM64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o ../opencode/dist/tui-darwin-arm64 \
            ./cmd/opencode/main.go
          
          # Windows AMD64
          echo "Building Windows AMD64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o ../opencode/dist/tui-windows-amd64.exe \
            ./cmd/opencode/main.go
          
          cd ../opencode
          
          # Build opencode binaries with embedded TUI
          echo "Building opencode binaries..."
          
          # Linux x64
          bun build \
            --define "OPENCODE_TUI_PATH='./dist/tui-linux-amd64'" \
            --define "OPENCODE_VERSION='$VERSION'" \
            --compile \
            --target=bun-linux-x64 \
            --outfile=dist/supercode-linux-x64 \
            ./src/index.ts
          
          # Linux ARM64
          bun build \
            --define "OPENCODE_TUI_PATH='./dist/tui-linux-arm64'" \
            --define "OPENCODE_VERSION='$VERSION'" \
            --compile \
            --target=bun-linux-arm64 \
            --outfile=dist/supercode-linux-arm64 \
            ./src/index.ts
          
          # Darwin x64
          bun build \
            --define "OPENCODE_TUI_PATH='./dist/tui-darwin-amd64'" \
            --define "OPENCODE_VERSION='$VERSION'" \
            --compile \
            --target=bun-darwin-x64 \
            --outfile=dist/supercode-darwin-x64 \
            ./src/index.ts
          
          # Darwin ARM64
          bun build \
            --define "OPENCODE_TUI_PATH='./dist/tui-darwin-arm64'" \
            --define "OPENCODE_VERSION='$VERSION'" \
            --compile \
            --target=bun-darwin-arm64 \
            --outfile=dist/supercode-darwin-arm64 \
            ./src/index.ts
          
          # Windows x64
          bun build \
            --define "OPENCODE_TUI_PATH='./dist/tui-windows-amd64.exe'" \
            --define "OPENCODE_VERSION='$VERSION'" \
            --compile \
            --target=bun-windows-x64 \
            --outfile=dist/supercode-windows-x64.exe \
            ./src/index.ts
          
          # Create zip archives
          echo "Creating archives..."
          cd dist
          
          # Remove TUI binaries (they're embedded in the main binaries)
          rm -f tui-*
          
          # Create zips
          for file in supercode-*; do
            if [[ "$file" == *.exe ]]; then
              zip "${file%.exe}.zip" "$file"
              rm "$file"
            else
              zip "${file}.zip" "$file"
              rm "$file"
            fi
          done
          
          ls -la *.zip
          cd ../../..

      - name: Commit version changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "release: v${{ env.VERSION }}"

      - name: Create and push tag
        run: |
          git tag -a "v${{ env.VERSION }}" -m "Release v${{ env.VERSION }}"
          git push origin HEAD --tags

      - name: Generate release notes
        run: |
          # Get the previous release tag
          PREV_TAG=$(git describe --tags --abbrev=0 "v${{ env.VERSION }}^" 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "# Supercode v${{ env.VERSION }}" > release_notes.md
            echo "" >> release_notes.md
            echo "First release of Supercode fork!" >> release_notes.md
          else
            echo "# Supercode v${{ env.VERSION }}" > release_notes.md
            echo "" >> release_notes.md
            echo "## What's Changed" >> release_notes.md
            echo "" >> release_notes.md
            
            # Get commit messages since last tag
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" | \
              grep -v -E "^- (release:|chore:|ci:|docs:|wip:)" | \
              head -20 >> release_notes.md || echo "- Various improvements and bug fixes" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "Download the appropriate binary for your platform from the assets below." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Quick Install (macOS/Linux)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo '# Download and extract (replace URL with your platform)' >> release_notes.md
          echo 'curl -L https://github.com/kirmad/supercode/releases/download/v${{ env.VERSION }}/supercode-$(uname -s | tr "[:upper:]" "[:lower:]")-$(uname -m | sed "s/x86_64/x64/").zip -o supercode.zip' >> release_notes.md
          echo 'unzip supercode.zip' >> release_notes.md
          echo 'chmod +x supercode' >> release_notes.md
          echo 'sudo mv supercode /usr/local/bin/' >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Supercode v${{ env.VERSION }}
          body_path: release_notes.md
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            packages/opencode/dist/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}