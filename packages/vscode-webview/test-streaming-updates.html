<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Streaming Research Updates</title>
  <style>
    body {
      font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .test-controls {
      background: #242424;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .test-button {
      background: #0066ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    .test-button:hover {
      background: #0052cc;
    }
    .test-prompt {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      margin: 10px 0;
      min-height: 60px;
      font-family: monospace;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 4px;
      font-size: 12px;
    }
    .log {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .research-item {
      padding: 8px;
      margin: 5px 0;
      background: #242424;
      border: 1px solid #333;
      border-radius: 4px;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .research-type {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 8px;
    }
    .type-analysis { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .type-pattern { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    .type-requirement { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
    .type-best-practice { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    #app {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Test Streaming Research Updates</h1>

    <div class="test-controls">
      <h3>Test Controls</h3>
      <textarea class="test-prompt" id="testPrompt" placeholder="Enter a test prompt...">Create a real-time dashboard with WebSocket updates</textarea>

      <div style="margin: 10px 0;">
        <button class="test-button" onclick="testRealEnhancement()">Test Real Enhancement</button>
        <button class="test-button" onclick="testSimulatedStreaming()">Test Simulated Streaming</button>
        <button class="test-button" onclick="clearLog()">Clear Log</button>
      </div>

      <div class="status" id="status">Ready to test</div>
    </div>

    <div id="researchItems" style="margin: 20px 0;">
      <h3>Research Updates (Real-time)</h3>
      <div id="researchList"></div>
    </div>

    <div>
      <h3>Console Log</h3>
      <div class="log" id="log"></div>
    </div>

    <div id="app"></div>
  </div>

  <script type="module">
    import { createApp } from '/src/main.ts'

    const app = createApp()
    app.mount('#app')

    window.log = function(message, data) {
      const logEl = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = `[${timestamp}] ${message}${data ? '\n' + JSON.stringify(data, null, 2) : ''}`;
      logEl.textContent += logEntry + '\n\n';
      logEl.scrollTop = logEl.scrollHeight;
      console.log(message, data);
    }

    window.updateStatus = function(message, type = 'info') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.style.background = type === 'error' ? '#3a1a1a' : '#2a2a2a';
      statusEl.style.color = type === 'error' ? '#ff6666' : '#e0e0e0';
    }

    window.addResearchItem = function(item) {
      const listEl = document.getElementById('researchList');
      const itemEl = document.createElement('div');
      itemEl.className = 'research-item';
      itemEl.innerHTML = `
        <span class="research-type type-${item.type}">${item.type}</span>
        <span>${item.content}</span>
      `;
      listEl.appendChild(itemEl);
    }

    window.clearLog = function() {
      document.getElementById('log').textContent = '';
      document.getElementById('researchList').innerHTML = '';
      window.updateStatus('Log cleared');
    }

    window.testRealEnhancement = async function() {
      const prompt = document.getElementById('testPrompt').value;
      if (!prompt) {
        window.updateStatus('Please enter a prompt', 'error');
        return;
      }

      window.updateStatus('Testing real enhancement with SuperCode...');
      document.getElementById('researchList').innerHTML = '';

      try {
        // Import the service
        const { PromptEnhancementService } = await import('/src/services/PromptEnhancementService.ts');
        const { SuperCodeWebSocketClient } = await import('/src/services/SuperCodeWebSocketClient.ts');

        // Create WebSocket client
        const wsClient = new SuperCodeWebSocketClient();
        await wsClient.connect();

        // Create enhancement service
        const service = new PromptEnhancementService(wsClient);

        // Set up real-time research callback
        service.onResearchUpdate = (items) => {
          window.log(`Research update: ${items.length} items`);
          document.getElementById('researchList').innerHTML = '';
          items.forEach(item => window.addResearchItem(item));
        };

        window.log('Starting enhancement...', { prompt });

        // Run enhancement
        const result = await service.enhancePrompt(prompt);

        window.updateStatus('Enhancement complete!');
        window.log('Final result:', result);

      } catch (error) {
        window.updateStatus(`Error: ${error.message}`, 'error');
        window.log('Error during enhancement:', error);
      }
    }

    window.testSimulatedStreaming = async function() {
      const prompt = document.getElementById('testPrompt').value;
      if (!prompt) {
        window.updateStatus('Please enter a prompt', 'error');
        return;
      }

      window.updateStatus('Testing simulated streaming...');
      document.getElementById('researchList').innerHTML = '';

      // Simulate streaming research updates
      const researchUpdates = [
        { type: 'analysis', content: 'Analyzing real-time requirements...', delay: 500 },
        { type: 'pattern', content: 'Identifying WebSocket patterns...', delay: 1000 },
        { type: 'requirement', content: 'Dashboard needs responsive design...', delay: 1500 },
        { type: 'best-practice', content: 'Use connection pooling for WebSockets...', delay: 2000 },
        { type: 'analysis', content: 'Consider using Socket.IO for fallback support...', delay: 2500 },
        { type: 'pattern', content: 'Implement reconnection with exponential backoff...', delay: 3000 },
      ];

      for (const update of researchUpdates) {
        await new Promise(resolve => setTimeout(resolve, update.delay));
        window.addResearchItem(update);
        window.log(`Added research: ${update.type}`, update);
      }

      window.updateStatus('Simulated streaming complete!');
    }

    // Initial setup
    window.log('Test page loaded and ready');
  </script>
</body>
</html>
