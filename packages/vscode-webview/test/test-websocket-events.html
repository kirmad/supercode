<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Event Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        #log {
            background: #000;
            padding: 10px;
            border: 1px solid #444;
            height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .event {
            color: #4CAF50;
            margin: 5px 0;
        }
        .error {
            color: #f44336;
        }
        .info {
            color: #2196F3;
        }
        button {
            margin: 10px 5px;
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #1976D2;
        }
    </style>
</head>
<body>
    <h1>WebSocket Event Test</h1>
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="sendMessage()">Send Test Message</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    <div id="log"></div>

    <script>
        let ws = null;
        const log = document.getElementById('log');

        function addLog(message, className = '') {
            const entry = document.createElement('div');
            entry.className = className;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function connect() {
            if (ws) {
                ws.close();
            }

            addLog('Connecting to WebSocket...', 'info');
            ws = new WebSocket('ws://localhost:8881/ws');

            ws.onopen = () => {
                addLog('✅ WebSocket connected', 'info');
                addLog('Waiting for Bus events (no subscription needed)...', 'info');
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    
                    if (message.type === 'event') {
                        addLog(`📨 EVENT: ${message.event} - ${JSON.stringify(message.data)}`, 'event');
                    } else if (message.type === 'response') {
                        addLog(`📬 RESPONSE: ${JSON.stringify(message)}`, 'info');
                    } else {
                        addLog(`📦 ${message.type?.toUpperCase() || 'MESSAGE'}: ${JSON.stringify(message)}`, 'info');
                    }
                } catch (e) {
                    addLog(`Raw message: ${event.data}`, 'info');
                }
            };

            ws.onerror = (error) => {
                addLog(`❌ WebSocket error: ${error}`, 'error');
            };

            ws.onclose = (event) => {
                addLog(`WebSocket closed: code=${event.code}, reason=${event.reason}`, 'info');
            };
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addLog('WebSocket not connected', 'error');
                return;
            }

            // Send a test request
            const request = {
                type: 'request',
                id: 'test-' + Date.now(),
                method: 'POST',
                path: '/tui/append-prompt',
                params: {
                    body: {
                        text: 'Test message from WebSocket event tester'
                    }
                },
                timestamp: Date.now()
            };

            ws.send(JSON.stringify(request));
            addLog(`📤 Sent: ${JSON.stringify(request)}`, 'info');
        }

        function clearLog() {
            log.innerHTML = '';
        }

        // Auto-connect on load
        window.onload = () => {
            connect();
        };
    </script>
</body>
</html>
